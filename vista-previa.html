<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vista previa</title>
  <meta name="description" content="Vista previa en vivo de la cotización -- se actualiza sola mientras editas en la otra ventana. No es el PDF final; para eso usa el botón Generar PDF de aquí mismo." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/vista-previa.css" />
</head>
<body class="vista-previa-pagina">

<div class="vp-topbar">
  <div>
    <h1 id="tituloVistaPrevia">Vista previa</h1>
    <p class="vp-sub" id="subtituloVistaPrevia"></p>
    <p class="vp-estado" id="estadoVistaPrevia">Cargando…</p>
  </div>
  <div class="acciones">
    <button type="button" id="btnRefrescarVistaPrevia" class="btn-secundario">↻ Refrescar ahora</button>
    <button type="button" id="btnGenerarPdfVistaPrevia" class="btn-primario">📄 Generar PDF</button>
  </div>
</div>

<main>
  <p class="nota" style="max-width:680pt; margin:14px auto; text-align:center;">
    Esto NO es el PDF -- es una aproximación con el mismo estilo/márgenes para que veas cómo va quedando sin
    generar el documento cada vez. Se actualiza sola cuando guardas un cambio en el editor (en la otra ventana).
    Para el documento real, usa "📄 Generar PDF" arriba.
  </p>
  <div id="contenedorSecciones"></div>
</main>

<div id="visorVistaPrevia" class="vp-visor"></div>

<script src="lib/jspdf.umd.min.js"></script>
<script type="module" src="js/vistaPrevia.js"></script>
</body>
</html>
