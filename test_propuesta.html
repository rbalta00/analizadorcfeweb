<!doctype html>
<html lang="es">
<head><meta charset="utf-8" /><title>Prueba generador de PDF (21 páginas)</title></head>
<body>
  <h1>Prueba: generar PDF completo (21 páginas) con datos reales de Abue</h1>
  <button id="btn">Generar y mostrar</button>
  <label><input type="checkbox" id="soloResumen" /> Solo la página 1 (probar que el toggle de bloques funciona)</label>
  <div id="visor" style="margin-top: 16px;"></div>

  <script src="lib/pdf.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script type="module">
    import { COSTOS_RESIDENCIAL } from './js/motor.js';
    import { construirResultado } from './js/resultado.js';
    import { generarPdf } from './js/propuesta.js';

    document.getElementById('btn').addEventListener('click', () => {
      // Datos reales del recibo de Casa del Abue Sur (ya verificados contra Python toda la sesion).
      const cargos = { suministro: 353.02, distribucion: 951.6, transmision: 432.24, cenace: 18.24,
                        capacidad: 2134.43, scnmem: 16.56, energia: 3182.4 };
      const r = construirResultado({
        titular: 'SEDIF CASA DEL ABUE II', domicilio: '103 PONIENTE 1559, BLVD CARMELITAS, MAYORAZGO 08H, C.P.72480, PUEBLA,PUE.',
        noServicio: '258260200990', tarifa: 'GDMTO', esDomestica: false,
        periodoDias: 32, periodoKwh: 2400.0, dap: 197.0, cargos, rateKw: { distribucion: 1.0, capacidad: 1.0 },
        btPct: 0.02000002821475378, fpBonusPct: 0.025000484076644545,
        moduloWp: 605, cobertura: 1.0, horasUtiles: 4.5, costos: COSTOS_RESIDENCIAL, escalamientoPct: 4.0,
        leido: { titular: 'SEDIF CASA DEL ABUE II', demanda_contratada_kw: null, historial: null, historial_meses_cubiertos: null },
        inmueble: { actividad: 'Centro de día para adultos mayores (SEDIF)', tensionFases: '220V trifásico', cubierta: 'Lámina galvanizada, buen estado' },
      });
      window.__r = r;

      const secciones = document.getElementById('soloResumen').checked ? ['resumen'] : null;
      const doc = generarPdf(r, { secciones });
      const blobUrl = doc.output('bloburl');
      document.getElementById('visor').innerHTML =
        `<iframe src="${blobUrl}" style="width:100%;height:1000px;border:1px solid #ccc;"></iframe>`;
      window.__doc = doc;
    });
  </script>
</body>
</html>
